# TEMPLATE ONLY. Never commit real values. Create the real secret from your shell or a secret manager, for example:
#   kubectl -n service-pacts create secret generic web-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... --from-literal=PORTAL_LINK_KEY=... (and the rest below)
# Or use External Secrets / Sealed Secrets so no plain value ever sits in git.
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: service-pacts
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "change-me"
  PORTAL_LINK_KEY: "change-me (32 random bytes, base64)"
  SIGNING_LINK_KEY: "change-me (32 random bytes, base64, a different value)"
  RESEND_API_KEY: "change-me"
  DOCUSEAL_API_KEY: "change-me"
  STRIPE_SECRET_KEY: "change-me"
  STRIPE_PUBLISHABLE_KEY: "change-me"
